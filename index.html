<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BYU Campus Calendar — every event on campus, in one place</title>
    <meta
      name="description"
      content="Every BYU event — athletics, arts, student life, lectures and career fairs — searchable in one place, filtered to what you care about, and syncable to your own calendar."
    />
    <meta name="theme-color" content="#002E5D" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- PWA. The manifest drives Android/desktop install; iOS Safari ignores it and reads the
         apple-* tags below, which is why both sets are present. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BYU Events" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="BYU Campus Calendar" />
    <meta property="og:description" content="Every event on campus, in one place. Filtered to you." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
