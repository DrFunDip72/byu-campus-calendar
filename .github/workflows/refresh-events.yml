# Re-pulls the BYU calendar daily and commits the snapshot, which triggers a Vercel deploy.
#
# Runs on GitHub's runners rather than in a Vercel function on purpose: calendar.byu.edu sits
# behind CloudFront, which 403s some datacenter IP ranges, so the fetch is kept somewhere we can
# see it fail loudly instead of degrading a live page.
#
# Two things here are load-bearing and were each the cause of a silent outage (see DECISIONS §26):
#
#   1. It runs `npm run build:data`, not `fetch-events.mjs` alone. The fetch rewrites the snapshot
#      from scratch, so running it by itself deletes the 20 badged stand-ins -- which would take
#      DEMO_COUNT to 0 and quietly remove the club-following demo the whole pitch rests on.
#   2. Node is pinned to 24. jsdom's bundled undici calls webidl.util.markAsUncloneable, which
#      Node 20 does not have, so `npm run smoke` crashed on every single run for three weeks and
#      the commit step was never reached.
name: Refresh event snapshot

on:
  schedule:
    - cron: '0 11 * * *' # 05:00 America/Denver (MDT) / 04:00 (MST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Pull events and re-seed the stand-ins
        run: npm run build:data

      - name: Verify the snapshot still builds and passes checks
        run: |
          npm ci
          npm run smoke
          npm run build

      # Nothing to commit is the normal outcome on a quiet day, not a failure.
      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet src/data/events.json; then
            echo 'No calendar changes today.'
            exit 0
          fi
          COUNT=$(node -e "process.stdout.write(String(require('./src/data/events.json').events.filter(e => !e.demo).length))")
          git add src/data/events.json
          git commit -m "Refresh event snapshot ($COUNT real events)"
          git push
